# Cards to watch. See README.md → "Adding a card".
#
# Each card:
#   name:        unique label shown in Discord (also the key for seen-listing history,
#                so renaming a card re-seeds it silently on the next run)
#   ebay:
#     queries:   list of eBay searches; results are merged and de-duplicated
#                eBay syntax: space = AND, -word = exclude, (a,b) = a OR b
#     exclude:   optional; drop listings whose title contains any of these (case-insensitive)
#     must_include: optional; keep only listings whose title contains at least one of these
#   tcgplayer:
#     product_ids: list of TCGplayer product IDs (the number in tcgplayer.com/product/<id>/...)

settings:
  poll_minutes: 15          # keep in sync with the cron in .github/workflows/poll.yml
  ebay_daily_call_limit: 5000
  ebay_category_id: "183454" # CCG Individual Cards
  ebay_marketplace: EBAY_US

cards:
  # --- Japanese BW secret rares ---
  - name: Chandelure - Hail Blizzard SR 057/052 (JP)
    ebay:
      queries:
        - chandelure hail blizzard -014
        - chandelure 057/052
      exclude: ["014/052"]
    tcgplayer:
      product_ids: [601061]

  - name: Emboar - Hail Blizzard SR 056/052 (JP)
    ebay:
      queries:
        - emboar hail blizzard
        - emboar 056/052
    tcgplayer:
