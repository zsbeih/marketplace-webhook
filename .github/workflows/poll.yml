name: Poll listings

on:
  schedule:
    # Backup only. GitHub runs schedules unreliably (sometimes hours apart), so the real
    # every-15-min trigger is cron-job.org calling workflow_dispatch; see README → "Reliable 15-minute runs".
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      test_webhook:
        description: "Only send a test message to each Discord webhook"
        type: boolean
        default: false
      post_current:
        description: "Post every current listing once (then only new ones)"
        type: choice
        options: ["no", "both", "ebay", "tcgplayer"]
        default: "no"

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new listings
        env:
          # Secret names: if yours differ, change the right-hand side here.
          DISCORD_WEBHOOK_EBAY: ${{ secrets.DISCORD_WEBHOOK_EBAY }}
          DISCORD_WEBHOOK_TCGPLAYER: ${{ secrets.DISCORD_WEBHOOK_TCGPLAYER }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          if [ "${{ inputs.test_webhook }}" = "true" ]; then
            python -m tracker.main --test-webhook
          elif [ "${{ inputs.post_current }}" = "both" ]; then
            python -m tracker.main --post-current
          elif [ -n "${{ inputs.post_current }}" ] && [ "${{ inputs.post_current }}" != "no" ]; then
            python -m tracker.main --post-current --source "${{ inputs.post_current }}"
          else
            python -m tracker.main
          fi

      - name: Save seen listings
        if: always() && inputs.test_webhook != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update seen listings"
          git pull --rebase --autostash
          git push
