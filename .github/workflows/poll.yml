name: Poll listings

on:
  schedule:
    - cron: "*/15 * * * *"   # keep settings.poll_minutes in cards.yaml in sync
  workflow_dispatch:
    inputs:
      test_webhook:
        description: "Only send a test message to each Discord webhook"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new listings
        env:
          # Secret names: if yours differ, change the right-hand side here.
          DISCORD_WEBHOOK_EBAY: ${{ secrets.DISCORD_WEBHOOK_EBAY }}
          DISCORD_WEBHOOK_TCGPLAYER: ${{ secrets.DISCORD_WEBHOOK_TCGPLAYER }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          if [ "${{ inputs.test_webhook }}" = "true" ]; then
            python -m tracker.main --test-webhook
          else
            python -m tracker.main
          fi

      - name: Save seen listings
        if: always() && inputs.test_webhook != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update seen listings"
          git pull --rebase --autostash
          git push
